<!--
  [INPUT]: 依赖同源 login.css/login.js、OwnDsh 鲸鱼 APNG、enterprise 两阶段认证 API、一次性改密 challenge 与宿主验证码端点。
  [OUTPUT]: 提供居中登录卡片、密码身份源 Tab、凭据认证、仅新密码 challenge、LDAP 密码提交与 OIDC 跳转页面骨架。
  [POS]: 公开认证页面，以独立静态资源复用 Console 登录语言，不加载管理端应用且不在同一次请求中混用初始密码与新密码。
  [PROTOCOL]: 变更时更新此头部，然后检查 CLAUDE.md
-->
<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>OwnDsh</title>
  <link rel="stylesheet" href="/enterprise/auth/login.css">
</head>
<body>
  <main class="auth-shell">
    <p class="brand-name">
      <img src="/enterprise/auth/owndsh-whale-mono-m2-animated.png" alt="">
      OwnDsh
    </p>
    <div class="auth-card">
      <header class="brand-block">
        <h1>登录企业工作区</h1>
      </header>

      <section class="auth-panel" aria-live="polite">
        <h2 id="panel-title">选择登录方式</h2>
        <div id="source-list" class="source-list" role="group" aria-label="登录方式" hidden></div>

        <form id="password-form" class="password-form" method="post" action="/enterprise/auth/v1/password" hidden>
          <input id="transaction-id" name="transactionId" type="hidden">
          <input id="source-id" name="sourceId" type="hidden">
          <input id="csrf-token" name="csrfToken" type="hidden">
          <input id="password-change-challenge" name="passwordChangeChallenge" type="hidden" disabled>
          <fieldset id="credential-fields" class="credential-fields">
            <label>
              <span>账号</span>
              <input id="username" name="username" autocomplete="username" maxlength="100" placeholder="请输入企业账号" required>
            </label>
            <label>
              <span>密码</span>
              <input id="password" name="password" type="password" autocomplete="current-password" maxlength="256" placeholder="请输入登录密码" required>
            </label>
          </fieldset>
          <div id="password-change-fields" class="password-change-fields" hidden>
            <p>初始密码仅可使用一次。新密码需至少 14 位，并包含大小写字母、数字和符号。</p>
            <label>
              <span>新密码</span>
              <input id="new-password" name="newPassword" type="password" autocomplete="new-password" minlength="14" maxlength="128">
            </label>
            <label>
              <span>确认新密码</span>
              <input id="confirm-password" type="password" autocomplete="new-password" minlength="14" maxlength="128">
            </label>
          </div>
          <div id="captcha-group" class="captcha-group" hidden>
            <input id="captcha-id" name="captchaId" type="hidden">
            <label>
              <span>验证码</span>
              <input id="captcha-code" name="captchaCode" inputmode="text" autocomplete="off" maxlength="16" placeholder="请输入验证码">
            </label>
            <button id="captcha-refresh" class="captcha-refresh" type="button" title="刷新验证码" aria-label="刷新验证码">
              <img id="captcha-image" alt="验证码">
            </button>
          </div>
          <button id="submit-button" class="primary-button" type="submit">登录</button>
        </form>

        <div id="oidc-list" class="oidc-list"></div>
        <p id="status" class="status" role="status"></p>
      </section>
    </div>
  </main>
  <script type="module" src="/enterprise/auth/login.js"></script>
</body>
</html>
