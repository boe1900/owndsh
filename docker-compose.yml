# [INPUT]: 依赖 deploy/compose/compose.yml 的唯一生产拓扑与 .env.example 默认环境。
# [OUTPUT]: 提供仓库根目录零配置可启动的 Docker Compose 入口。
# [POS]: 面向源码部署用户的薄入口，只装配默认环境并允许 shell/.env 覆盖，库内初始化由 Server 中的 Flyway 完成。
# [PROTOCOL]: 变更时更新此头部，然后检查 CLAUDE.md

include:
  - path: ./deploy/compose/compose.yml
    env_file: ./.env.example
