<!--
  [INPUT]: 依赖同源 login.css/login.js、enterprise 两阶段认证 API、一次性改密 challenge 与 RuoYi 验证码端点。
  [OUTPUT]: 提供身份源选择、凭据认证、仅新密码 challenge、LDAP 密码提交与 OIDC 跳转页面骨架。
  [POS]: 公开认证页面，不加载管理端应用，初始密码与新密码不会出现在同一次请求。
  [PROTOCOL]: 变更时更新此头部，然后检查 CLAUDE.md
-->
<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Enterprise Agent Platform</title>
  <link rel="stylesheet" href="/enterprise/auth/login.css">
</head>
<body>
  <main class="auth-shell">
    <header class="brand-block">
      <span class="brand-mark" aria-hidden="true">EA</span>
      <div>
        <p class="brand-name">Enterprise Agent Platform</p>
        <h1>登录企业工作区</h1>
      </div>
    </header>

    <section class="auth-panel" aria-live="polite">
      <h2 id="panel-title">选择身份源</h2>
      <div id="source-list" class="source-list"></div>

      <form id="password-form" class="password-form" method="post" action="/enterprise/auth/v1/password" hidden>
        <input id="transaction-id" name="transactionId" type="hidden">
        <input id="source-id" name="sourceId" type="hidden">
        <input id="csrf-token" name="csrfToken" type="hidden">
        <input id="password-change-challenge" name="passwordChangeChallenge" type="hidden" disabled>
        <button id="back-button" class="back-button" type="button" aria-label="返回身份源">←</button>
        <p id="selected-source" class="selected-source"></p>
        <fieldset id="credential-fields" class="credential-fields">
          <label>
            <span>账号</span>
            <input id="username" name="username" autocomplete="username" maxlength="100" required>
          </label>
          <label>
            <span>密码</span>
            <input id="password" name="password" type="password" autocomplete="current-password" maxlength="256" required>
          </label>
        </fieldset>
        <div id="password-change-fields" class="password-change-fields" hidden>
          <p>初始密码仅可使用一次。新密码需至少 14 位，并包含大小写字母、数字和符号。</p>
          <label>
            <span>新密码</span>
            <input id="new-password" name="newPassword" type="password" autocomplete="new-password" minlength="14" maxlength="128">
          </label>
          <label>
            <span>确认新密码</span>
            <input id="confirm-password" type="password" autocomplete="new-password" minlength="14" maxlength="128">
          </label>
        </div>
        <div id="captcha-group" class="captcha-group" hidden>
          <input id="captcha-id" name="captchaId" type="hidden">
          <label>
            <span>验证码</span>
            <input id="captcha-code" name="captchaCode" inputmode="text" autocomplete="off" maxlength="16">
          </label>
          <button id="captcha-refresh" class="captcha-refresh" type="button" title="刷新验证码" aria-label="刷新验证码">
            <img id="captcha-image" alt="验证码">
          </button>
        </div>
        <button id="submit-button" class="primary-button" type="submit">登录</button>
      </form>

      <p id="status" class="status" role="status"></p>
    </section>
  </main>
  <script type="module" src="/enterprise/auth/login.js"></script>
</body>
</html>
