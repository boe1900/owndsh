# [INPUT]: 依赖 model.yaml 管理 DTO、bootstrap DTO 与根协议通用参数/错误响应
# [OUTPUT]: 提供 provider/model/model-set/grant 管理 Path Item 和 runtime bootstrap Path Item
# [POS]: contracts/paths 的受管模型纵向分片，管理写入统一使用幂等键/If-Match 且 runtime 只接受当前设备会话
# [PROTOCOL]: 变更时更新此头部，然后检查 CLAUDE.md

ProviderCollection:
  get:
    operationId: listModelProviders
    parameters:
      - $ref: '../enterprise-openapi.yaml#/components/parameters/Cursor'
      - $ref: '../enterprise-openapi.yaml#/components/parameters/Limit'
    responses:
      '200':
        description: Provider page.
        content:
          application/json:
            schema: {$ref: '../enterprise-openapi.yaml#/components/schemas/ProviderListResponse'}
      '401': {$ref: '../enterprise-openapi.yaml#/components/responses/Error401'}
      '403': {$ref: '../enterprise-openapi.yaml#/components/responses/Error403'}
  post:
    operationId: createModelProvider
    parameters:
      - $ref: '../enterprise-openapi.yaml#/components/parameters/IdempotencyKey'
    requestBody:
      required: true
      content:
        application/json:
          schema: {$ref: '../enterprise-openapi.yaml#/components/schemas/ProviderCreateRequest'}
    responses:
      '201':
        description: Created provider.
        content:
          application/json:
            schema: {$ref: '../enterprise-openapi.yaml#/components/schemas/ProviderResponse'}
      '400': {$ref: '../enterprise-openapi.yaml#/components/responses/Error400'}
      '401': {$ref: '../enterprise-openapi.yaml#/components/responses/Error401'}
      '403': {$ref: '../enterprise-openapi.yaml#/components/responses/Error403'}
ProviderItem:
  parameters:
    - $ref: '../enterprise-openapi.yaml#/components/parameters/ProviderIdPath'
  get:
    operationId: getModelProvider
    responses:
      '200':
        description: Provider details.
        content:
          application/json:
            schema: {$ref: '../enterprise-openapi.yaml#/components/schemas/ProviderResponse'}
      '401': {$ref: '../enterprise-openapi.yaml#/components/responses/Error401'}
      '403': {$ref: '../enterprise-openapi.yaml#/components/responses/Error403'}
      '404': {$ref: '../enterprise-openapi.yaml#/components/responses/Error404'}
  put:
    operationId: updateModelProvider
    parameters:
      - $ref: '../enterprise-openapi.yaml#/components/parameters/IfMatchRevision'
    requestBody:
      required: true
      content:
        application/json:
          schema: {$ref: '../enterprise-openapi.yaml#/components/schemas/ProviderUpdateRequest'}
    responses:
      '200':
        description: Updated provider.
        content:
          application/json:
            schema: {$ref: '../enterprise-openapi.yaml#/components/schemas/ProviderResponse'}
      '400': {$ref: '../enterprise-openapi.yaml#/components/responses/Error400'}
      '401': {$ref: '../enterprise-openapi.yaml#/components/responses/Error401'}
      '403': {$ref: '../enterprise-openapi.yaml#/components/responses/Error403'}
      '404': {$ref: '../enterprise-openapi.yaml#/components/responses/Error404'}
      '409': {$ref: '../enterprise-openapi.yaml#/components/responses/Error409'}
ProviderTest:
  parameters:
    - $ref: '../enterprise-openapi.yaml#/components/parameters/ProviderIdPath'
  post:
    operationId: testModelProvider
    requestBody:
      required: true
      content:
        application/json:
          schema: {$ref: '../enterprise-openapi.yaml#/components/schemas/ProviderProbeRequest'}
    responses:
      '200':
        description: Sanitized provider probe result.
        content:
          application/json:
            schema: {$ref: '../enterprise-openapi.yaml#/components/schemas/ProviderProbeResponse'}
      '400': {$ref: '../enterprise-openapi.yaml#/components/responses/Error400'}
      '401': {$ref: '../enterprise-openapi.yaml#/components/responses/Error401'}
      '403': {$ref: '../enterprise-openapi.yaml#/components/responses/Error403'}
      '404': {$ref: '../enterprise-openapi.yaml#/components/responses/Error404'}
ProviderEnable:
  parameters:
    - $ref: '../enterprise-openapi.yaml#/components/parameters/ProviderIdPath'
  post:
    operationId: enableModelProvider
    parameters:
      - $ref: '../enterprise-openapi.yaml#/components/parameters/IfMatchRevision'
    responses:
      '200':
        description: Enabled provider.
        content:
          application/json:
            schema: {$ref: '../enterprise-openapi.yaml#/components/schemas/ProviderResponse'}
      '401': {$ref: '../enterprise-openapi.yaml#/components/responses/Error401'}
      '403': {$ref: '../enterprise-openapi.yaml#/components/responses/Error403'}
      '404': {$ref: '../enterprise-openapi.yaml#/components/responses/Error404'}
      '409': {$ref: '../enterprise-openapi.yaml#/components/responses/Error409'}
ProviderDisable:
  parameters:
    - $ref: '../enterprise-openapi.yaml#/components/parameters/ProviderIdPath'
  post:
    operationId: disableModelProvider
    parameters:
      - $ref: '../enterprise-openapi.yaml#/components/parameters/IfMatchRevision'
    responses:
      '200':
        description: Disabled provider.
        content:
          application/json:
            schema: {$ref: '../enterprise-openapi.yaml#/components/schemas/ProviderResponse'}
      '401': {$ref: '../enterprise-openapi.yaml#/components/responses/Error401'}
      '403': {$ref: '../enterprise-openapi.yaml#/components/responses/Error403'}
      '404': {$ref: '../enterprise-openapi.yaml#/components/responses/Error404'}
      '409': {$ref: '../enterprise-openapi.yaml#/components/responses/Error409'}

