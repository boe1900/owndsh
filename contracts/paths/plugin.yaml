# [INPUT]: 依赖 plugin.yaml DTO 与根协议的 ID、cursor、revision、幂等键和统一错误响应
# [OUTPUT]: 提供配置登记、发布/退休、原子发布并迁移旧版范围、库存及 runtime 分配/上报 Path Item
# [POS]: contracts/paths 的插件纵向分片，每次读取目录重算 assignment，客户端安装前必须重新读取授权
# [PROTOCOL]: 变更时更新此头部，然后检查 CLAUDE.md

PluginCollection:
  get:
    operationId: listPluginPackages
    parameters:
      - $ref: '../enterprise-openapi.yaml#/components/parameters/Cursor'
      - $ref: '../enterprise-openapi.yaml#/components/parameters/Limit'
    responses:
      '200':
        description: Plugin package page with versions.
        content:
          application/json:
            schema: {$ref: '../enterprise-openapi.yaml#/components/schemas/PluginPackageListResponse'}
      '401': {$ref: '../enterprise-openapi.yaml#/components/responses/Error401'}
      '403': {$ref: '../enterprise-openapi.yaml#/components/responses/Error403'}

PluginVersionRegistration:
  post:
    operationId: registerPluginVersion
    requestBody:
      required: true
      content:
        application/json:
          schema: {$ref: '../enterprise-openapi.yaml#/components/schemas/PluginRegistrationRequest'}
    responses:
      '201':
        description: Configured plugin version; installation is delegated to the host package manager.
        content:
          application/json:
            schema: {$ref: '../enterprise-openapi.yaml#/components/schemas/PluginVersionResponse'}
      '200':
        description: Existing identical configuration.
        content:
          application/json:
            schema: {$ref: '../enterprise-openapi.yaml#/components/schemas/PluginVersionResponse'}
      '400': {$ref: '../enterprise-openapi.yaml#/components/responses/Error400'}
      '401': {$ref: '../enterprise-openapi.yaml#/components/responses/Error401'}
      '403': {$ref: '../enterprise-openapi.yaml#/components/responses/Error403'}

PluginVersionPublish:
  parameters:
    - $ref: '../enterprise-openapi.yaml#/components/parameters/PluginVersionIdPath'
  post:
    operationId: publishPluginVersion
    parameters:
      - $ref: '../enterprise-openapi.yaml#/components/parameters/IfMatchRevision'
    requestBody:
      required: false
      description: When provided, publish and move the source version's active INSTALLED assignments atomically; preserve withdrawals and other versions. If-Match checks the target version and packageRevision checks the package and assignments.
      content:
        application/json:
          schema: {$ref: '../enterprise-openapi.yaml#/components/schemas/PluginPublishRequest'}
    responses:
      '200':
        description: Published plugin version, with optional assignment migration completed in the same transaction.
        content:
          application/json:
            schema: {$ref: '../enterprise-openapi.yaml#/components/schemas/PluginVersionResponse'}
      '400': {$ref: '../enterprise-openapi.yaml#/components/responses/Error400'}
      '401': {$ref: '../enterprise-openapi.yaml#/components/responses/Error401'}
      '403': {$ref: '../enterprise-openapi.yaml#/components/responses/Error403'}
      '404': {$ref: '../enterprise-openapi.yaml#/components/responses/Error404'}
      '409': {$ref: '../enterprise-openapi.yaml#/components/responses/Error409'}

PluginVersionRetire:
  parameters:
    - $ref: '../enterprise-openapi.yaml#/components/parameters/PluginVersionIdPath'
  post:
    operationId: retirePluginVersion
    parameters:
      - $ref: '../enterprise-openapi.yaml#/components/parameters/IfMatchRevision'
    responses:
      '200':
        description: Retired plugin version.
        content:
          application/json:
            schema: {$ref: '../enterprise-openapi.yaml#/components/schemas/PluginVersionResponse'}
      '401': {$ref: '../enterprise-openapi.yaml#/components/responses/Error401'}
      '403': {$ref: '../enterprise-openapi.yaml#/components/responses/Error403'}
      '404': {$ref: '../enterprise-openapi.yaml#/components/responses/Error404'}
      '409': {$ref: '../enterprise-openapi.yaml#/components/responses/Error409'}

PluginAssignmentBatch:
  parameters:
    - $ref: '../enterprise-openapi.yaml#/components/parameters/PluginPackageIdPath'
  post:
    operationId: replacePluginAssignments
    parameters:
      - $ref: '../enterprise-openapi.yaml#/components/parameters/IdempotencyKey'
      - $ref: '../enterprise-openapi.yaml#/components/parameters/IfMatchRevision'
    requestBody:
      required: true
      content:
        application/json:
          schema: {$ref: '../enterprise-openapi.yaml#/components/schemas/PluginAssignmentBatchRequest'}
    responses:
      '200':
        description: Replaced plugin assignments.
        content:
          application/json:
            schema: {$ref: '../enterprise-openapi.yaml#/components/schemas/PluginAssignmentBatchResponse'}
      '400': {$ref: '../enterprise-openapi.yaml#/components/responses/Error400'}
      '401': {$ref: '../enterprise-openapi.yaml#/components/responses/Error401'}
      '403': {$ref: '../enterprise-openapi.yaml#/components/responses/Error403'}
      '404': {$ref: '../enterprise-openapi.yaml#/components/responses/Error404'}
      '409': {$ref: '../enterprise-openapi.yaml#/components/responses/Error409'}

AdminPluginInventory:
  get:
    operationId: listPluginInventory
    parameters:
      - $ref: '../enterprise-openapi.yaml#/components/parameters/Cursor'
      - $ref: '../enterprise-openapi.yaml#/components/parameters/Limit'
    responses:
      '200':
        description: Managed device plugin inventory page.
        content:
          application/json:
            schema: {$ref: '../enterprise-openapi.yaml#/components/schemas/AdminPluginInventoryListResponse'}
      '401': {$ref: '../enterprise-openapi.yaml#/components/responses/Error401'}
      '403': {$ref: '../enterprise-openapi.yaml#/components/responses/Error403'}

RuntimePluginAssignments:
  get:
    operationId: getPluginAssignments
    responses:
      '200':
        description: Effective assignments for the active Harness device owner.
        content:
          application/json:
            schema: {$ref: '../enterprise-openapi.yaml#/components/schemas/RuntimePluginAssignmentsResponse'}
      '401': {$ref: '../enterprise-openapi.yaml#/components/responses/Error401'}
      '403': {$ref: '../enterprise-openapi.yaml#/components/responses/Error403'}

RuntimePluginInventory:
  put:
    operationId: replacePluginInventory
    requestBody:
      required: true
      content:
        application/json:
          schema: {$ref: '../enterprise-openapi.yaml#/components/schemas/PluginInventoryRequest'}
    responses:
      '200':
        description: Inventory replacement accepted.
        content:
          application/json:
            schema: {$ref: '../enterprise-openapi.yaml#/components/schemas/PluginInventoryResponse'}
      '400': {$ref: '../enterprise-openapi.yaml#/components/responses/Error400'}
      '401': {$ref: '../enterprise-openapi.yaml#/components/responses/Error401'}
      '403': {$ref: '../enterprise-openapi.yaml#/components/responses/Error403'}
