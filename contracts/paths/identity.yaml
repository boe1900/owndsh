      responses:
        '200':
          description: Disabled identity source.
          headers:
            X-Request-Id:
              $ref: '../enterprise-openapi.yaml#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '../enterprise-openapi.yaml#/components/schemas/IdentitySourceResponse'
        '401':
          $ref: '../enterprise-openapi.yaml#/components/responses/Error401'
        '403':
          $ref: '../enterprise-openapi.yaml#/components/responses/Error403'
        '404':
          $ref: '../enterprise-openapi.yaml#/components/responses/Error404'
        '409':
          $ref: '../enterprise-openapi.yaml#/components/responses/Error409'
  /enterprise/admin/v1/group-mappings:
