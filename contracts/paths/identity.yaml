        '401':
          $ref: '../enterprise-openapi.yaml#/components/responses/Error401'
        '403':
          $ref: '../enterprise-openapi.yaml#/components/responses/Error403'
        '404':
          $ref: '../enterprise-openapi.yaml#/components/responses/Error404'
        '409':
          $ref: '../enterprise-openapi.yaml#/components/responses/Error409'
  /enterprise/admin/v1/identity-sources/{sourceId}/actions/disable:
    parameters:
      - $ref: '../enterprise-openapi.yaml#/components/parameters/IdentitySourceIdPath'
    post:
      operationId: disableIdentitySource
      summary: Disable one identity source using revision CAS.
      parameters:
