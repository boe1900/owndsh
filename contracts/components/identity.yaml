# [INPUT]: 依赖 enterprise-openapi.yaml 的 RequestId、Revision 与 CursorPage 公共协议
# [OUTPUT]: 提供 T04 身份源、OIDC/LDAP 配置、组映射和删除确认 schemas
# [POS]: OpenAPI 逻辑真源的身份治理 schema 分片，由根 components 逐项引用并由生成器整体 bundle/hash
# [PROTOCOL]: 变更时更新此头部，然后检查 CLAUDE.md
IdentitySourceId:
  type: string
  pattern: '^[1-9][0-9]{0,18}$'
  description: Identity source snowflake ID serialized as a string.
GroupMappingId:
  type: string
  pattern: '^[1-9][0-9]{0,18}$'
  description: External group mapping snowflake ID serialized as a string.
DepartmentId:
  type: string
  pattern: '^[1-9][0-9]{0,18}$'
  description: RuoYi department snowflake ID serialized as a string.
IdentitySourceType:
  type: string
  enum: [OIDC, LDAP, LOCAL]
IdentitySourceStatus:
  type: string
  enum: [ACTIVE, DISABLED]
OidcClaimMapping:
  type: object
  additionalProperties: false
  required: [username, displayName]
  properties:
    username:
      type: string
      minLength: 1
      maxLength: 128
    displayName:
      type: string
      minLength: 1
      maxLength: 128
    email:
      type: string
      minLength: 1
      maxLength: 128
    groups:
      type: string
      minLength: 1
      maxLength: 128
OidcSettings:
  type: object
  additionalProperties: false
  required: [scopes, claims]
  properties:
    scopes:
      type: array
      minItems: 1
      maxItems: 32
      uniqueItems: true
      contains:
        const: openid
      items:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^\S+$'
    claims:
      $ref: '#/OidcClaimMapping'
LdapSettings:
  type: object
  additionalProperties: false
  required:
    - url
    - baseDn
    - managerDn
    - userFilter
    - stableIdAttribute
    - usernameAttribute
    - displayNameAttribute
    - startTls
  properties:
    url:
      type: string
      format: uri
      maxLength: 500
    baseDn:
      type: string
      minLength: 1
      maxLength: 512
    managerDn:
      type: string
      minLength: 1
      maxLength: 512
    userFilter:
      type: string
      minLength: 3
      maxLength: 512
    stableIdAttribute:
      type: string
      minLength: 1
      maxLength: 128
    usernameAttribute:
      type: string
      minLength: 1
      maxLength: 128
    displayNameAttribute:
      type: string
      minLength: 1
      maxLength: 128
    emailAttribute:
      type: string
      minLength: 1
      maxLength: 128
    groupAttribute:
      type: string
      minLength: 1
      maxLength: 128
    startTls:
      type: boolean
IdentitySourceCreateRequest:
  type: object
  additionalProperties: false
  required: [type, name, secret]
  properties:
    type:
      $ref: '#/IdentitySourceType'
    name:
      type: string
      minLength: 1
      maxLength: 100
    issuer:
      type: string
      format: uri
      maxLength: 500
    clientId:
      type: string
      minLength: 1
      maxLength: 255
    oidc:
      $ref: '#/OidcSettings'
    ldap:
      $ref: '#/LdapSettings'
    secret:
      type: string
      minLength: 1
      maxLength: 4096
      writeOnly: true
IdentitySourceUpdateRequest:
  type: object
  additionalProperties: false
  required: [type, name]
  properties:
    type:
      $ref: '#/IdentitySourceType'
    name:
      type: string
      minLength: 1
      maxLength: 100
    issuer:
      type: string
      format: uri
      maxLength: 500
    clientId:
      type: string
      minLength: 1
      maxLength: 255
    oidc:
      $ref: '#/OidcSettings'
    ldap:
      $ref: '#/LdapSettings'
    secret:
      type: string
      minLength: 1
      maxLength: 4096
      writeOnly: true
IdentitySource:
  type: object
  additionalProperties: false
  required:
    - id
    - type
    - name
    - secretConfigured
    - status
    - revision
    - createdAt
    - updatedAt
  properties:
    id:
      $ref: '#/IdentitySourceId'
    type:
      $ref: '#/IdentitySourceType'
    name:
      type: string
      minLength: 1
      maxLength: 100
    issuer:
      type: string
      format: uri
      maxLength: 500
    clientId:
      type: string
      minLength: 1
      maxLength: 255
    oidc:
      $ref: '#/OidcSettings'
    ldap:
      $ref: '#/LdapSettings'
    secretConfigured:
      type: boolean
    status:
      $ref: '#/IdentitySourceStatus'
    revision:
      $ref: '../enterprise-openapi.yaml#/components/schemas/Revision'
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time
IdentitySourceResponse:
  type: object
  additionalProperties: false
  required: [data, requestId]
  properties:
    data:
      $ref: '#/IdentitySource'
    requestId:
      $ref: '../enterprise-openapi.yaml#/components/schemas/RequestId'
IdentitySourcePageData:
  type: object
  additionalProperties: false
  required: [items, page]
  properties:
    items:
      type: array
      maxItems: 200
      items:
        $ref: '#/IdentitySource'
    page:
      $ref: '../enterprise-openapi.yaml#/components/schemas/CursorPage'
IdentitySourceListResponse:
  type: object
  additionalProperties: false
  required: [data, requestId]
  properties:
    data:
      $ref: '#/IdentitySourcePageData'
    requestId:
      $ref: '../enterprise-openapi.yaml#/components/schemas/RequestId'
IdentitySourceConnection:
  type: object
  additionalProperties: false
  required: [type, ok, diagnostic]
  properties:
    type:
      $ref: '#/IdentitySourceType'
    ok:
      type: boolean
    diagnostic:
      type: string
      minLength: 1
      maxLength: 64
IdentitySourceTestResponse:
  type: object
  additionalProperties: false
  required: [data, requestId]
  properties:
    data:
      $ref: '#/IdentitySourceConnection'
    requestId:
      $ref: '../enterprise-openapi.yaml#/components/schemas/RequestId'
GroupMappingCreateRequest:
  type: object
  additionalProperties: false
  required: [sourceId, externalGroup, departmentId]
  properties:
    sourceId:
      $ref: '#/IdentitySourceId'
    externalGroup:
      type: string
      minLength: 1
      maxLength: 512
    departmentId:
      $ref: '#/DepartmentId'
GroupMapping:
  type: object
  additionalProperties: false
  required: [id, sourceId, externalGroup, departmentId, revision]
  properties:
    id:
      $ref: '#/GroupMappingId'
    sourceId:
      $ref: '#/IdentitySourceId'
    externalGroup:
      type: string
      minLength: 1
      maxLength: 512
    departmentId:
      $ref: '#/DepartmentId'
    revision:
      $ref: '../enterprise-openapi.yaml#/components/schemas/Revision'
GroupMappingResponse:
  type: object
  additionalProperties: false
  required: [data, requestId]
  properties:
    data:
      $ref: '#/GroupMapping'
    requestId:
      $ref: '../enterprise-openapi.yaml#/components/schemas/RequestId'
GroupMappingPageData:
  type: object
  additionalProperties: false
  required: [items, page]
  properties:
    items:
      type: array
      maxItems: 200
      items:
        $ref: '#/GroupMapping'
    page:
      $ref: '../enterprise-openapi.yaml#/components/schemas/CursorPage'
GroupMappingListResponse:
  type: object
  additionalProperties: false
  required: [data, requestId]
  properties:
    data:
      $ref: '#/GroupMappingPageData'
    requestId:
      $ref: '../enterprise-openapi.yaml#/components/schemas/RequestId'
DeletedResource:
  type: object
  additionalProperties: false
  required: [id, deleted]
  properties:
    id:
      type: string
      pattern: '^[1-9][0-9]{0,18}$'
    deleted:
      type: boolean
      const: true
DeletedResourceResponse:
  type: object
  additionalProperties: false
  required: [data, requestId]
  properties:
    data:
      $ref: '#/DeletedResource'
    requestId:
      $ref: '../enterprise-openapi.yaml#/components/schemas/RequestId'
