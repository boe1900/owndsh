# [INPUT]: 依赖 enterprise-openapi.yaml 的 RequestId、Revision 与 CursorPage 公共协议
# [OUTPUT]: 提供身份源、LDAP 目录发现/导入、JIT/LINK_ONLY、扁平用户组、外部组映射和删除确认 schemas
# [POS]: OpenAPI 逻辑真源的身份治理 schema 分片，保持认证、provisioning 与授权语义分离
# [PROTOCOL]: 变更时更新此头部，然后检查 CLAUDE.md
IdentitySourceId:
  type: string
  pattern: '^[1-9][0-9]{0,18}$'
  description: Identity source snowflake ID serialized as a string.
GroupMappingId:
  type: string
  pattern: '^[1-9][0-9]{0,18}$'
  description: External group mapping snowflake ID serialized as a string.
AccessGroupId:
  type: string
  pattern: '^[1-9][0-9]{0,18}$'
  description: Product access group snowflake ID serialized as a string.
DepartmentId:
  type: string
  pattern: '^[1-9][0-9]{0,18}$'
  description: Host department snowflake ID serialized as a string.
IdentitySourceType:
  type: string
  enum: [OIDC, LDAP, LOCAL]
IdentityProvisioningMode:
  type: string
  enum: [JIT, LINK_ONLY]
IdentitySourceStatus:
  type: string
  enum: [ACTIVE, DISABLED]
OidcClaimMapping:
  type: object
  additionalProperties: false
  required: [username, displayName]
  properties:
    username:
      type: string
      minLength: 1
      maxLength: 128
    displayName:
      type: string
      minLength: 1
      maxLength: 128
    email:
      type: string
      minLength: 1
      maxLength: 128
    groups:
      type: string
      minLength: 1
      maxLength: 128
OidcSettings:
  type: object
  additionalProperties: false
  required: [scopes, claims]
  properties:
    scopes:
      type: array
      minItems: 1
      maxItems: 32
      uniqueItems: true
      contains:
        const: openid
      items:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^\S+$'
    claims:
      $ref: '#/OidcClaimMapping'
LdapSettings:
  type: object
  additionalProperties: false
  required:
    - url
    - baseDn
    - managerDn
    - userFilter
    - stableIdAttribute
    - usernameAttribute
    - displayNameAttribute
    - startTls
  properties:
    url:
      type: string
      format: uri
      maxLength: 500
    baseDn:
      type: string
      minLength: 1
      maxLength: 512
    managerDn:
      type: string
      minLength: 1
      maxLength: 512
    userFilter:
      type: string
      minLength: 3
      maxLength: 512
    stableIdAttribute:
      type: string
      minLength: 1
      maxLength: 128
    usernameAttribute:
      type: string
      minLength: 1
      maxLength: 128
    displayNameAttribute:
      type: string
      minLength: 1
      maxLength: 128
    emailAttribute:
      type: string
      minLength: 1
      maxLength: 128
    groupAttribute:
      type: string
      minLength: 1
      maxLength: 128
    groupBaseDn:
      type: string
      minLength: 1
      maxLength: 512
    groupFilter:
      type: string
      minLength: 3
      maxLength: 512
    groupNameAttribute:
      type: string
      minLength: 1
      maxLength: 128
    startTls:
      type: boolean
IdentitySourceCreateRequest:
  type: object
  additionalProperties: false
  required: [type, provisioningMode, name, secret]
  properties:
    type:
      $ref: '#/IdentitySourceType'
    provisioningMode:
      $ref: '#/IdentityProvisioningMode'
    name:
      type: string
      minLength: 1
      maxLength: 100
    issuer:
      type: string
      format: uri
      maxLength: 500
    clientId:
      type: string
      minLength: 1
      maxLength: 255
    oidc:
      $ref: '#/OidcSettings'
    ldap:
      $ref: '#/LdapSettings'
    secret:
      type: string
      minLength: 1
      maxLength: 4096
      writeOnly: true
IdentitySourceUpdateRequest:
  type: object
  additionalProperties: false
  required: [type, provisioningMode, name]
  properties:
    type:
      $ref: '#/IdentitySourceType'
    provisioningMode:
      $ref: '#/IdentityProvisioningMode'
    name:
      type: string
      minLength: 1
      maxLength: 100
    issuer:
      type: string
      format: uri
      maxLength: 500
    clientId:
      type: string
      minLength: 1
      maxLength: 255
    oidc:
      $ref: '#/OidcSettings'
    ldap:
      $ref: '#/LdapSettings'
    secret:
      type: string
      minLength: 1
      maxLength: 4096
      writeOnly: true
IdentitySource:
  type: object
  additionalProperties: false
  required:
    - id
    - type
    - provisioningMode
    - name
    - secretConfigured
    - status
    - revision
    - createdAt
    - updatedAt
  properties:
    id:
      $ref: '#/IdentitySourceId'
    type:
      $ref: '#/IdentitySourceType'
    provisioningMode:
      $ref: '#/IdentityProvisioningMode'
    name:
      type: string
      minLength: 1
      maxLength: 100
    issuer:
      type: string
      format: uri
      maxLength: 500
    clientId:
      type: string
      minLength: 1
      maxLength: 255
    oidc:
      $ref: '#/OidcSettings'
    ldap:
      $ref: '#/LdapSettings'
    secretConfigured:
      type: boolean
    status:
      $ref: '#/IdentitySourceStatus'
    revision:
      $ref: '../enterprise-openapi.yaml#/components/schemas/Revision'
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time
    lastTestedAt:
      type: string
      format: date-time
    lastTestOk:
      type: boolean
    lastTestDiagnostic:
      type: string
      minLength: 1
      maxLength: 64
IdentitySourceResponse:
  type: object
  additionalProperties: false
  required: [data, requestId]
  properties:
    data:
      $ref: '#/IdentitySource'
    requestId:
      $ref: '../enterprise-openapi.yaml#/components/schemas/RequestId'
IdentitySourcePageData:
  type: object
  additionalProperties: false
  required: [items, page]
  properties:
    items:
      type: array
      maxItems: 200
      items:
        $ref: '#/IdentitySource'
    page:
      $ref: '../enterprise-openapi.yaml#/components/schemas/CursorPage'
IdentitySourceListResponse:
  type: object
  additionalProperties: false
  required: [data, requestId]
  properties:
    data:
      $ref: '#/IdentitySourcePageData'
    requestId:
      $ref: '../enterprise-openapi.yaml#/components/schemas/RequestId'
IdentitySourceConnection:
  type: object
  additionalProperties: false
  required: [type, ok, diagnostic]
  properties:
    type:
      $ref: '#/IdentitySourceType'
    ok:
      type: boolean
    diagnostic:
      type: string
      minLength: 1
      maxLength: 64
IdentitySourceTestResponse:
  type: object
  additionalProperties: false
  required: [data, requestId]
  properties:
    data:
      $ref: '#/IdentitySourceConnection'
    requestId:
      $ref: '../enterprise-openapi.yaml#/components/schemas/RequestId'
LdapDirectoryUser:
  type: object
  additionalProperties: false
  required: [dn, externalSubject, username, displayName, email]
  properties:
    dn: {type: string, minLength: 1, maxLength: 1024}
    externalSubject: {type: string, minLength: 1, maxLength: 512}
    username: {type: string, minLength: 1, maxLength: 128}
    displayName: {type: string, minLength: 1, maxLength: 256}
    email:
      oneOf:
        - {type: string, maxLength: 320}
        - {type: 'null'}
LdapDirectoryUserSearch:
  type: object
  additionalProperties: false
  required: [items]
  properties:
    items:
      type: array
      maxItems: 50
      items: {$ref: '#/LdapDirectoryUser'}
LdapDirectoryUserSearchResponse:
  type: object
  additionalProperties: false
  required: [data, requestId]
  properties:
    data: {$ref: '#/LdapDirectoryUserSearch'}
    requestId: {$ref: '../enterprise-openapi.yaml#/components/schemas/RequestId'}
LdapDirectoryGroup:
  type: object
  additionalProperties: false
  required: [externalGroup, displayName]
  properties:
    externalGroup:
      type: string
      minLength: 1
      maxLength: 1024
      description: Group DN used as the explicit mapping key.
    displayName: {type: string, minLength: 1, maxLength: 256}
LdapDirectoryGroupSearch:
  type: object
  additionalProperties: false
  required: [items]
  properties:
    items:
      type: array
      maxItems: 50
      items: {$ref: '#/LdapDirectoryGroup'}
LdapDirectoryGroupSearchResponse:
  type: object
  additionalProperties: false
  required: [data, requestId]
  properties:
    data: {$ref: '#/LdapDirectoryGroupSearch'}
    requestId: {$ref: '../enterprise-openapi.yaml#/components/schemas/RequestId'}
LdapMemberImportRequest:
  type: object
  additionalProperties: false
  required: [dn]
  properties:
    dn: {type: string, minLength: 1, maxLength: 1024}
LdapMemberImport:
  type: object
  additionalProperties: false
  required: [userId, created]
  properties:
    userId: {$ref: '../enterprise-openapi.yaml#/components/schemas/EnterpriseUserId'}
    created: {type: boolean}
LdapMemberImportResponse:
  type: object
  additionalProperties: false
  required: [data, requestId]
  properties:
    data: {$ref: '#/LdapMemberImport'}
    requestId: {$ref: '../enterprise-openapi.yaml#/components/schemas/RequestId'}
AccessGroupWriteRequest:
  type: object
  additionalProperties: false
  required: [name, memberIds]
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 120
    memberIds:
      type: array
      uniqueItems: true
      maxItems: 200
      items:
        $ref: '../enterprise-openapi.yaml#/components/schemas/EnterpriseUserId'
AccessGroup:
  type: object
  additionalProperties: false
  required: [id, name, manualMemberIds, memberCount, revision]
  properties:
    id: {$ref: '#/AccessGroupId'}
    name:
      type: string
      minLength: 1
      maxLength: 120
    manualMemberIds:
      type: array
      uniqueItems: true
      maxItems: 200
      items:
        $ref: '../enterprise-openapi.yaml#/components/schemas/EnterpriseUserId'
    memberCount:
      type: integer
      minimum: 0
    revision:
      $ref: '../enterprise-openapi.yaml#/components/schemas/Revision'
AccessGroupResponse:
  type: object
  additionalProperties: false
  required: [data, requestId]
  properties:
    data: {$ref: '#/AccessGroup'}
    requestId:
      $ref: '../enterprise-openapi.yaml#/components/schemas/RequestId'
AccessGroupPageData:
  type: object
  additionalProperties: false
  required: [items, page]
  properties:
    items:
      type: array
      maxItems: 200
      items: {$ref: '#/AccessGroup'}
    page:
      $ref: '../enterprise-openapi.yaml#/components/schemas/CursorPage'
AccessGroupListResponse:
  type: object
  additionalProperties: false
  required: [data, requestId]
  properties:
    data: {$ref: '#/AccessGroupPageData'}
    requestId:
      $ref: '../enterprise-openapi.yaml#/components/schemas/RequestId'

GroupMappingCreateRequest:
  type: object
  additionalProperties: false
  required: [sourceId, externalGroup, accessGroupId]
  properties:
    sourceId:
      $ref: '#/IdentitySourceId'
    externalGroup:
      type: string
      minLength: 1
      maxLength: 512
    accessGroupId:
      $ref: '#/AccessGroupId'
GroupMapping:
  type: object
  additionalProperties: false
  required: [id, sourceId, externalGroup, accessGroupId, revision]
  properties:
    id:
      $ref: '#/GroupMappingId'
    sourceId:
      $ref: '#/IdentitySourceId'
    externalGroup:
      type: string
      minLength: 1
      maxLength: 512
    accessGroupId:
      $ref: '#/AccessGroupId'
    revision:
      $ref: '../enterprise-openapi.yaml#/components/schemas/Revision'
GroupMappingResponse:
  type: object
  additionalProperties: false
  required: [data, requestId]
  properties:
    data:
      $ref: '#/GroupMapping'
    requestId:
      $ref: '../enterprise-openapi.yaml#/components/schemas/RequestId'
GroupMappingPageData:
  type: object
  additionalProperties: false
  required: [items, page]
  properties:
    items:
      type: array
      maxItems: 200
      items:
        $ref: '#/GroupMapping'
    page:
      $ref: '../enterprise-openapi.yaml#/components/schemas/CursorPage'
GroupMappingListResponse:
  type: object
  additionalProperties: false
  required: [data, requestId]
  properties:
    data:
      $ref: '#/GroupMappingPageData'
    requestId:
      $ref: '../enterprise-openapi.yaml#/components/schemas/RequestId'
DeletedResource:
  type: object
  additionalProperties: false
  required: [id, deleted]
  properties:
    id:
      type: string
      pattern: '^[1-9][0-9]{0,18}$'
    deleted:
      type: boolean
      const: true
DeletedResourceResponse:
  type: object
  additionalProperties: false
  required: [data, requestId]
  properties:
    data:
      $ref: '#/DeletedResource'
    requestId:
      $ref: '../enterprise-openapi.yaml#/components/schemas/RequestId'
ExternalIdentitySummary:
  type: object
  additionalProperties: false
  required: [sourceId, sourceName, sourceType, externalSubject, lastLoginAt]
  properties:
    sourceId:
      $ref: '#/IdentitySourceId'
    sourceName:
      type: string
      minLength: 1
      maxLength: 100
    sourceType:
      $ref: '#/IdentitySourceType'
    externalSubject:
      type: string
      minLength: 1
      maxLength: 512
    lastLoginAt:
      oneOf:
        - type: string
          format: date-time
        - type: 'null'
ExternalIdentitySummaryResponse:
  type: object
  additionalProperties: false
  required: [data, requestId]
  properties:
    data:
      type: array
      maxItems: 32
      items:
        $ref: '#/ExternalIdentitySummary'
    requestId:
      $ref: '../enterprise-openapi.yaml#/components/schemas/RequestId'
