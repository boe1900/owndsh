# [INPUT]: 依赖 auth 固定角色/身份类型与根协议的 UserId、cursor、requestId。
# [OUTPUT]: 提供 LOCAL 成员创建、产品成员列表/详情、角色/状态、身份绑定发起和脱敏身份/设备/Session 摘要 schemas。
# [POS]: contracts/components 的成员治理真源，不暴露 Host 部门、岗位、权限树、groups、claims 或凭据。
# [PROTOCOL]: 变更时更新此头部，然后检查 CLAUDE.md

MemberStatus:
  type: string
  enum: [ACTIVE, DISABLED]

MemberLoginMethod:
  type: object
  additionalProperties: false
  required: [sourceId, sourceName, sourceType, lastLoginAt]
  properties:
    sourceId:
      oneOf:
        - $ref: './identity.yaml#/IdentitySourceId'
        - type: 'null'
    sourceName:
      type: string
      minLength: 1
      maxLength: 100
    sourceType:
      $ref: './identity.yaml#/IdentitySourceType'
    lastLoginAt:
      oneOf:
        - type: string
          format: date-time
        - type: 'null'

MemberSummary:
  type: object
  additionalProperties: false
  required: [id, username, displayName, status, roles, loginMethods, lastActiveAt, revision]
  properties:
    id:
      $ref: '../enterprise-openapi.yaml#/components/schemas/EnterpriseUserId'
    username:
      type: string
      minLength: 1
      maxLength: 30
    displayName:
      type: string
      minLength: 1
      maxLength: 30
    status:
      $ref: '#/MemberStatus'
    roles:
      type: array
      maxItems: 5
      uniqueItems: true
      items:
        $ref: './auth.yaml#/BuiltInRole'
    loginMethods:
      type: array
      maxItems: 20
      items:
        $ref: '#/MemberLoginMethod'
    lastActiveAt:
      oneOf:
        - type: string
          format: date-time
        - type: 'null'
    revision:
      $ref: '../enterprise-openapi.yaml#/components/schemas/Revision'

MemberIdentity:
  type: object
  additionalProperties: false
  required: [identityId, sourceId, sourceName, sourceType, subject, lastLoginAt]
  properties:
    identityId:
      oneOf:
        - type: string
          pattern: '^[1-9][0-9]{0,18}$'
        - type: 'null'
    sourceId:
      oneOf:
        - $ref: './identity.yaml#/IdentitySourceId'
        - type: 'null'
    sourceName:
      type: string
      minLength: 1
      maxLength: 100
    sourceType:
      $ref: './identity.yaml#/IdentitySourceType'
    subject:
      type: string
      minLength: 1
      maxLength: 512
    lastLoginAt:
      oneOf:
        - type: string
          format: date-time
        - type: 'null'

MemberDeviceSummary:
  type: object
  additionalProperties: false
  required: [id, name, platform, status, lastSeenAt]
  properties:
    id:
      $ref: '../enterprise-openapi.yaml#/components/schemas/EnterpriseDeviceId'
    name:
      type: string
      minLength: 1
      maxLength: 120
    platform:
      type: string
      minLength: 1
      maxLength: 64
    status:
      $ref: './device.yaml#/DeviceStatus'
    lastSeenAt:
      oneOf:
        - type: string
          format: date-time
        - type: 'null'

MemberSessionSummary:
  type: object
  additionalProperties: false
  required: [active, deleted, expired, latestUpdatedAt]
  properties:
    active:
      type: integer
      minimum: 0
      maximum: 9007199254740991
    deleted:
      type: integer
      minimum: 0
      maximum: 9007199254740991
    expired:
      type: integer
      minimum: 0
      maximum: 9007199254740991
    latestUpdatedAt:
      oneOf:
        - type: string
          format: date-time
        - type: 'null'

MemberDetail:
  type: object
  additionalProperties: false
  required: [member, identities, devices, sessions]
  properties:
    member:
      $ref: '#/MemberSummary'
    identities:
      type: array
      maxItems: 32
      items:
        $ref: '#/MemberIdentity'
    devices:
      type: array
      maxItems: 100
      items:
        $ref: '#/MemberDeviceSummary'
    sessions:
      $ref: '#/MemberSessionSummary'

MemberDetailResponse:
  type: object
  additionalProperties: false
  required: [data, requestId]
  properties:
    data:
      $ref: '#/MemberDetail'
    requestId:
      $ref: '../enterprise-openapi.yaml#/components/schemas/RequestId'

LocalMemberCreateRequest:
  type: object
  additionalProperties: false
  required: [username, displayName, initialPassword]
  properties:
    username:
      type: string
      minLength: 3
      maxLength: 30
      pattern: '^[A-Za-z][A-Za-z0-9._-]{2,29}$'
    displayName:
      type: string
      minLength: 1
      maxLength: 120
    email:
      type: string
      format: email
      maxLength: 50
    initialPassword:
      type: string
      minLength: 14
      maxLength: 128
      writeOnly: true

MemberStatusUpdateRequest:
  type: object
  additionalProperties: false
  required: [status]
  properties:
    status:
      $ref: '#/MemberStatus'

MemberRoleReplaceRequest:
  type: object
  additionalProperties: false
  required: [roles]
  properties:
    roles:
      type: array
      minItems: 1
      maxItems: 5
      uniqueItems: true
      items:
        $ref: './auth.yaml#/BuiltInRole'

IdentityLinkStartRequest:
  type: object
  additionalProperties: false
  required: [sourceId]
  properties:
    sourceId:
      $ref: './identity.yaml#/IdentitySourceId'

IdentityLinkStart:
  type: object
  additionalProperties: false
  required: [transactionId, authorizeUri]
  properties:
    transactionId:
      type: string
      pattern: '^tx_[A-Za-z0-9_-]{20,128}$'
    authorizeUri:
      type: string
      pattern: '^/enterprise/auth/login\.html\?transaction_id=tx_[A-Za-z0-9_-]+&source_id=[1-9][0-9]{0,18}$'

IdentityLinkStartResponse:
  type: object
  additionalProperties: false
  required: [data, requestId]
  properties:
    data:
      $ref: '#/IdentityLinkStart'
    requestId:
      $ref: '../enterprise-openapi.yaml#/components/schemas/RequestId'

MemberPageData:
  type: object
  additionalProperties: false
  required: [items, page]
  properties:
    items:
      type: array
      maxItems: 200
      items:
        $ref: '#/MemberSummary'
    page:
      $ref: '../enterprise-openapi.yaml#/components/schemas/CursorPage'

MemberListResponse:
  type: object
  additionalProperties: false
  required: [data, requestId]
  properties:
    data:
      $ref: '#/MemberPageData'
    requestId:
      $ref: '../enterprise-openapi.yaml#/components/schemas/RequestId'
