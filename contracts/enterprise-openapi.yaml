    TokenResponse: {$ref: './components/auth.yaml#/TokenResponse'}
    LogoutData: {$ref: './components/auth.yaml#/LogoutData'}
    LogoutResponse: {$ref: './components/auth.yaml#/LogoutResponse'}
    DeviceStatus: {$ref: './components/device.yaml#/DeviceStatus'}
    Device: {$ref: './components/device.yaml#/Device'}
    DeviceEnrollRequest: {$ref: './components/device.yaml#/DeviceEnrollRequest'}
    DeviceHeartbeatRequest: {$ref: './components/device.yaml#/DeviceHeartbeatRequest'}
