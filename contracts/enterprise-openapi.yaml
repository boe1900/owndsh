    IdentitySourcePageData: {$ref: './components/identity.yaml#/IdentitySourcePageData'}
    IdentitySourceListResponse: {$ref: './components/identity.yaml#/IdentitySourceListResponse'}
    IdentitySourceConnection: {$ref: './components/identity.yaml#/IdentitySourceConnection'}
