components:
  securitySchemes:
    EnterpriseBearer:
      type: http
      scheme: bearer
      bearerFormat: Sa-Token

  parameters:
    AuthClientId:
      name: client_id
      in: query
      required: true
      schema:
        $ref: '#/components/schemas/PlatformClient'
    AuthRedirectUri:
      name: redirect_uri
      in: query
      required: true
      schema:
        type: string
        format: uri
        minLength: 1
        maxLength: 2048
    AuthState:
      name: state
      in: query
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 512
        pattern: '^[A-Za-z0-9._~-]+$'
    PkceChallenge:
      name: code_challenge
      in: query
      required: true
      schema:
        $ref: '#/components/schemas/PkceCodeChallenge'
    PkceChallengeMethod:
      name: code_challenge_method
      in: query
      required: true
      schema:
        type: string
        const: S256
    InstallationIdQuery:
      name: installation_id
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/InstallationId'
    AuthTransactionIdQuery:
      name: transaction_id
      in: query
      required: true
      schema:
        $ref: '#/components/schemas/AuthTransactionId'
    DeviceIdPath:
      name: deviceId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/EnterpriseDeviceId'
    IdentitySourceIdPath:
      name: sourceId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/IdentitySourceId'
    IdentitySourceIdQuery:
      name: sourceId
      in: query
      required: true
      schema:
        $ref: '#/components/schemas/IdentitySourceId'
    GroupMappingIdPath:
      name: mappingId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/GroupMappingId'
    ProviderIdPath:
      name: providerId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ModelProviderId'
    ManagedModelIdPath:
      name: modelId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ManagedModelId'
    ModelGrantIdPath:
      name: grantId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ModelGrantId'
    QuotaPolicyIdPath:
      name: quotaId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/QuotaPolicyId'
    Cursor:
      name: cursor
      in: query
      required: false
      description: Server-signed opaque cursor; clients must not parse it.
      schema:
        $ref: '#/components/schemas/Cursor'
    Limit:
      name: limit
      in: query
      required: false
      description: Cursor page size.
      schema:
        $ref: '#/components/schemas/PageLimit'
    IfMatchRevision:
      name: If-Match
      in: header
      required: true
      description: Current resource revision used for compare-and-swap updates.
      schema:
        $ref: '#/components/schemas/Revision'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Caller-generated UUID v4 reused only for one logical write.
      schema:
        type: string
        format: uuid
        minLength: 36
        maxLength: 36
        pattern: '^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-4[0-9A-Fa-f]{3}-[89ABab][0-9A-Fa-f]{3}-[0-9A-Fa-f]{12}$'

  headers:
    XRequestId:
      description: Server-generated request correlation ID.
      required: true
      schema:
        $ref: '#/components/schemas/RequestId'

  responses:
    Error400:
      description: Invalid request.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EnterpriseErrorResponse'
    Error401:
      description: Authentication failed.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EnterpriseErrorResponse'
    Error403:
      description: Permission denied.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EnterpriseErrorResponse'
    Error404:
      description: Resource not found.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EnterpriseErrorResponse'
    Error409:
      description: Revision, idempotency, or state conflict.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EnterpriseErrorResponse'
    Error413:
      description: Request or archive is too large.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EnterpriseErrorResponse'
    Error429:
      description: Quota exceeded.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EnterpriseErrorResponse'
    Error502:
      description: Upstream rejected or returned an invalid response.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EnterpriseErrorResponse'
    Error503:
      description: Platform or upstream is unavailable.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EnterpriseErrorResponse'
    Error504:
      description: Upstream timed out.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EnterpriseErrorResponse'

  schemas:
    RequestId:
      type: string
      description: Server-generated req_ prefix followed by one canonical ULID.
      pattern: '^req_[0-9A-HJKMNP-TV-Z]{26}$'
      examples:
        - req_01ARZ3NDEKTSV4RRFFQ69G5FAV
    Revision:
      type: integer
      minimum: 0
      maximum: 9007199254740991
      description: Monotonic compare-and-swap revision safe in JavaScript.
      examples: [7]
    Cursor:
      type: string
      minLength: 16
      maxLength: 512
      pattern: '^[A-Za-z0-9_-]+$'
      description: Server-signed opaque cursor.
    PageLimit:
      type: integer
      minimum: 1
      maximum: 200
      default: 50
    IdentitySourceId: {$ref: './components/identity.yaml#/IdentitySourceId'}
    GroupMappingId: {$ref: './components/identity.yaml#/GroupMappingId'}
    DepartmentId: {$ref: './components/identity.yaml#/DepartmentId'}
    IdentitySourceType: {$ref: './components/identity.yaml#/IdentitySourceType'}
    IdentitySourceStatus: {$ref: './components/identity.yaml#/IdentitySourceStatus'}
    OidcClaimMapping: {$ref: './components/identity.yaml#/OidcClaimMapping'}
    OidcSettings: {$ref: './components/identity.yaml#/OidcSettings'}
    LdapSettings: {$ref: './components/identity.yaml#/LdapSettings'}
    IdentitySourceCreateRequest: {$ref: './components/identity.yaml#/IdentitySourceCreateRequest'}
    IdentitySourceUpdateRequest: {$ref: './components/identity.yaml#/IdentitySourceUpdateRequest'}
    IdentitySource: {$ref: './components/identity.yaml#/IdentitySource'}
