    GroupMappingCreateRequest: {$ref: './components/identity.yaml#/GroupMappingCreateRequest'}
    GroupMapping: {$ref: './components/identity.yaml#/GroupMapping'}
    GroupMappingResponse: {$ref: './components/identity.yaml#/GroupMappingResponse'}
    GroupMappingPageData: {$ref: './components/identity.yaml#/GroupMappingPageData'}
    GroupMappingListResponse: {$ref: './components/identity.yaml#/GroupMappingListResponse'}
    DeletedResource: {$ref: './components/identity.yaml#/DeletedResource'}
    DeletedResourceResponse: {$ref: './components/identity.yaml#/DeletedResourceResponse'}
    PlatformClient: {$ref: './components/auth.yaml#/PlatformClient'}
    AuthTransactionId: {$ref: './components/auth.yaml#/AuthTransactionId'}
    AuthorizationCode: {$ref: './components/auth.yaml#/AuthorizationCode'}
    PkceCodeChallenge: {$ref: './components/auth.yaml#/PkceCodeChallenge'}
    PkceCodeVerifier: {$ref: './components/auth.yaml#/PkceCodeVerifier'}
    InstallationId: {$ref: './components/auth.yaml#/InstallationId'}
    PublicIdentitySource: {$ref: './components/auth.yaml#/PublicIdentitySource'}
    AuthSourcesData: {$ref: './components/auth.yaml#/AuthSourcesData'}
    AuthSourcesResponse: {$ref: './components/auth.yaml#/AuthSourcesResponse'}
    PasswordLoginRequest: {$ref: './components/auth.yaml#/PasswordLoginRequest'}
    TokenRequest: {$ref: './components/auth.yaml#/TokenRequest'}
