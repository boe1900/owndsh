# [INPUT]: 依赖详细设计冻结的 HTTP 约定、paths/ operation 分片与 components/ schema 分片
# [OUTPUT]: 提供 OpenAPI 3.1 导航根、通用 envelope、品牌 ID、requestId、revision、cursor 和错误边界
# [POS]: contracts 的逻辑协议根，纵向任务通过受控 Path Item/schema 引用扩展且完整 bundle/hash 仍是唯一协议
# [PROTOCOL]: 变更时更新此头部，然后检查 CLAUDE.md
openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: Enterprise Agent Platform API
  version: 0.1.0
  description: >-
    Shared protocol components. Business operations are added only by the
    vertical task that also implements and protects the matching Controller.
security:
  - EnterpriseBearer: []

paths:
  /enterprise/auth/v1/authorize:
