  /enterprise/admin/v1/providers:
    $ref: './paths/model.yaml#/ProviderCollection'
  /enterprise/admin/v1/providers/{providerId}:
    $ref: './paths/model.yaml#/ProviderItem'
  /enterprise/admin/v1/providers/{providerId}/actions/test:
    $ref: './paths/model.yaml#/ProviderTest'
  /enterprise/admin/v1/providers/{providerId}/actions/enable:
    $ref: './paths/model.yaml#/ProviderEnable'
  /enterprise/admin/v1/providers/{providerId}/actions/disable:
    $ref: './paths/model.yaml#/ProviderDisable'
  /enterprise/admin/v1/models:
