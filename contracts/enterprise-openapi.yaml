  /enterprise/admin/v1/models/{modelId}:
    $ref: './paths/model.yaml#/ModelItem'
  /enterprise/admin/v1/models/{modelId}/actions/enable:
    $ref: './paths/model.yaml#/ModelEnable'
  /enterprise/admin/v1/models/{modelId}/actions/disable:
    $ref: './paths/model.yaml#/ModelDisable'
  /enterprise/admin/v1/model-grants:
    $ref: './paths/model.yaml#/GrantCollection'
  /enterprise/admin/v1/model-grants/batch:
    $ref: './paths/model.yaml#/GrantBatch'
  /enterprise/admin/v1/model-grants/{grantId}:
    $ref: './paths/model.yaml#/GrantItem'
  /enterprise/api/v1/bootstrap:
    $ref: './paths/model.yaml#/Bootstrap'
  /enterprise/admin/v1/quotas:
    $ref: './paths/quota.yaml#/QuotaCollection'
  /enterprise/admin/v1/quotas/{quotaId}:
    $ref: './paths/quota.yaml#/QuotaItem'
  /enterprise/admin/v1/quotas/{quotaId}/actions/enable:
    $ref: './paths/quota.yaml#/QuotaEnable'
  /enterprise/admin/v1/quotas/{quotaId}/actions/disable:
