# [INPUT]: 官方 dsh.bundle patch、Host plugin-manager/settings 和 plugin-market service
# [OUTPUT]: 企业模型策略、OwnDsh Host、官方 Discover 市场与企业索引源
# [POS]: bundle 的企业 profile 组合层；插件安装与权限归官方 DSH plugin manager 和插件自身处理
# [PROTOCOL]: 变更时更新此头部，然后检查 CLAUDE.md
- id: agent-default-model
  config:
    provider: enterprise
    model: enterprise/default

- id: llm-deepseek
  disabled: true

- id: llm-deepseek-account
  disabled: true

- id: llm-pi-ai
  disabled: true

- id: ui-settings-models
  disabled: true

- insert:
    - id: owndsh-plugin-market
      name: '@deepseek-ai/dsh-plugin-market'
      # 官方可选 bundle 已经插入同模块行时保留官方设置 entry；否则 OwnDsh 自己提供市场服务。
      disabled: !!js "ctx.loader.entries().some(entry => entry.options.name === '@deepseek-ai/dsh-plugin-market' && entry.options.id !== 'owndsh-plugin-market')"
    - id: owndsh-ui-plugin-market
      name: '@deepseek-ai/dsh-client-ui-plugin-market'
      disabled: !!js "ctx.loader.entries().some(entry => entry.options.name === '@deepseek-ai/dsh-client-ui-plugin-market' && entry.options.id !== 'owndsh-ui-plugin-market')"
    - id: owndsh
      name: 'owndsh-plugin'
