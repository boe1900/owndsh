# [INPUT]: 依赖官方 dsh.bundle patch 覆盖、裸包名 Loader 与 base/web 既有 row id
# [OUTPUT]: 覆盖企业默认模型、停用个人模型与官方插件管理入口并插入 owndsh Host/Client row
# [POS]: bundle 的企业 profile 策略层；官方模型与插件 Host 能力保留，员工插件操作统一进入企业市场
# [PROTOCOL]: 变更时更新此头部，然后检查 CLAUDE.md
- id: agent-default-model
  config:
    provider: enterprise
    model: enterprise/default

- id: llm-deepseek
  disabled: true

- id: llm-pi-ai
  disabled: true

- id: ui-settings-models
  disabled: true

- id: ui-plugin-manager
  disabled: true

- insert:
    - id: owndsh
      name: 'owndsh-plugin'
