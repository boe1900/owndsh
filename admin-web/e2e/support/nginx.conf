# [INPUT]: 依赖临时 TLS key/cert、Host 路由与 host.docker.internal 上两组管理端/Server 端口
# [OUTPUT]: 提供标准 443 多 Host HTTPS、dev/prod API 精确路由与可信转发头
# [POS]: e2e/support 的容器代理配置，以 127.0.0.1/localhost 隔离并行纵向验收环境
# [PROTOCOL]: 变更时更新此头部，然后检查 CLAUDE.md

events {}

http {
  upstream admin_t12 {
    server host.docker.internal:18000;
  }

  upstream admin_t15 {
    server host.docker.internal:8000;
  }

  upstream server_t12 {
    server host.docker.internal:18080;
  }

  upstream server_t15 {
    server host.docker.internal:18081;
  }

  map $host $admin_backend {
    default admin_t12;
    localhost admin_t15;
  }

  map $host $server_backend {
    default server_t12;
    localhost server_t15;
  }

  server {
    listen 443 ssl;
    server_name 127.0.0.1;
    ssl_certificate /tls/eap-t12-tls.crt;
    ssl_certificate_key /tls/eap-t12-tls.key;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;

    location /dev-api/ {
      rewrite ^/dev-api(/.*)$ $1 break;
      proxy_pass http://$server_backend;
    }

    location /prod-api/ {
      rewrite ^/prod-api(/.*)$ $1 break;
      proxy_pass http://$server_backend;
    }

    location /enterprise/auth/v1/ {
      proxy_pass http://$server_backend;
    }

    location ~ ^/enterprise/auth/login\.(html|css|js)$ {
      proxy_pass http://$server_backend;
    }

    location = /auth/code {
      proxy_pass http://$server_backend;
    }

    location / {
      proxy_pass http://$admin_backend;
    }
  }
}
