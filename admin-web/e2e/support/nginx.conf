# [INPUT]: 依赖临时 TLS key/cert 与 host.docker.internal 上的管理端/Server
# [OUTPUT]: 提供标准 443 单 origin HTTPS、dev/prod API 精确路由与可信转发头
# [POS]: e2e/support 的容器代理配置，规避宿主普通进程不能绑定特权端口
# [PROTOCOL]: 变更时更新此头部，然后检查 CLAUDE.md

events {}

http {
  server {
    listen 443 ssl;
    server_name 127.0.0.1;
    ssl_certificate /tls/eap-t12-tls.crt;
    ssl_certificate_key /tls/eap-t12-tls.key;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;

    location /dev-api/ {
      proxy_pass http://host.docker.internal:18080/;
    }

    location /prod-api/ {
      proxy_pass http://host.docker.internal:18080/;
    }

    location /enterprise/auth/v1/ {
      proxy_pass http://host.docker.internal:18080;
    }

    location ~ ^/enterprise/auth/login\.(html|css|js)$ {
      proxy_pass http://host.docker.internal:18080;
    }

    location = /auth/code {
      proxy_pass http://host.docker.internal:18080;
    }

    location / {
      proxy_pass http://host.docker.internal:18000;
    }
  }
}
