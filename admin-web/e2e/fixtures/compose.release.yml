# [INPUT]: 依赖已安装 release Compose、可由 JSSE 无密码读取证书的临时 JKS truststore 与 fixture 宿主发布端口。
# [OUTPUT]: 仅为 T22 Server 增加候选 IdP/LDAP 宿主解析、确定性登录和不携带创建密码的只读测试 CA truststore。
# [POS]: release 候选验收 overlay；不改变生产服务、网络、端口或持久卷定义，测试结束随临时 project 销毁。
# [PROTOCOL]: 变更时更新此头部，然后检查 CLAUDE.md

services:
  server:
    environment:
      CAPTCHA_ENABLE: "false"
      JAVA_TOOL_OPTIONS: >-
        -XX:MaxRAMPercentage=75
        -XX:+ExitOnOutOfMemoryError
        -Djavax.net.ssl.trustStore=/run/acceptance/candidate-truststore.jks
        -Djavax.net.ssl.trustStoreType=JKS
    extra_hosts:
      - "candidate-idp.localhost:host-gateway"
      - "ldap.candidate.test:host-gateway"
    volumes:
      - ${EAP_T22_LDAP_TRUSTSTORE:?EAP_T22_LDAP_TRUSTSTORE must be set}:/run/acceptance/candidate-truststore.jks:ro
