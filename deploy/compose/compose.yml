# [INPUT]: 依赖 release manifest/runtime.env、上游 PostgreSQL 基线、安装 secret、四个持久卷、可写临时目录与锁定 Linux amd64 镜像。
# [OUTPUT]: 提供首次装载上游基线、只发布 HTTP 8080 的 Console、具备 Fontconfig 临时缓存的单 Server、PostgreSQL 17.6 和 Redis 7.4.5 拓扑。
# [POS]: T21 部署运行时事实源；OwnDsh 不终止 TLS，空数据库先由官方 initdb 装载 version 0，Flyway 接管后续版本。
# [PROTOCOL]: 变更时更新此头部，然后检查 CLAUDE.md

name: ${OWNDSH_COMPOSE_PROJECT_NAME:-owndsh}

services:
  postgres:
    image: ${OWNDSH_BASE_IMAGE_REGISTRY:-docker.io/library}/postgres:17.6-alpine3.22@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
    platform: linux/amd64
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${ENT_POSTGRES_DATABASE:-owndsh}
      POSTGRES_USER: ${ENT_POSTGRES_USERNAME:-owndsh}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      TZ: UTC
    secrets:
      - postgres_password
    configs:
      - source: postgres_baseline
        target: /docker-entrypoint-initdb.d/00-owndsh-baseline.sql
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    networks: [backend]
    security_opt: [no-new-privileges:true]

  redis:
    image: ${OWNDSH_BASE_IMAGE_REGISTRY:-docker.io/library}/redis:7.4.5-alpine3.21@sha256:bb186d083732f669da90be8b0f975a37812b15e913465bb14d845db72a4e3e08
    platform: linux/amd64
    restart: unless-stopped
    command:
      - sh
      - -ec
      - exec redis-server --appendonly yes --appendfsync everysec --requirepass "$$(cat /run/secrets/redis_password)"
    secrets:
      - redis_password
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$(cat /run/secrets/redis_password) redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 5s
    networks: [backend]
    security_opt: [no-new-privileges:true]

  storage-init:
    image: ${OWNDSH_SERVER_IMAGE:?OWNDSH_SERVER_IMAGE must be set}
    platform: linux/amd64
    user: "0:0"
    command: ["sh", "-ec", "chown -R 10001:10001 /var/lib/enterprise /app/logs"]
    volumes:
      - artifacts:/var/lib/enterprise/artifacts
      - server_logs:/app/logs
    restart: "no"
    networks: [backend]
    cap_drop: [ALL]
    cap_add: [CHOWN]
    security_opt: [no-new-privileges:true]

  server:
    image: ${OWNDSH_SERVER_IMAGE:?OWNDSH_SERVER_IMAGE must be set}
    platform: linux/amd64
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: deploy
      ENT_PUBLIC_BASE_URL: ${ENT_PUBLIC_BASE_URL:?ENT_PUBLIC_BASE_URL must be set}
      ENT_ADMIN_REDIRECT_URI: ${ENT_ADMIN_REDIRECT_URI:?ENT_ADMIN_REDIRECT_URI must be set}
      ENT_DEPLOYMENT_TIME_ZONE: ${ENT_DEPLOYMENT_TIME_ZONE:-Asia/Shanghai}
      ENT_ALLOW_INSECURE_OIDC: ${ENT_ALLOW_INSECURE_OIDC:-false}
      ENT_POSTGRES_DATABASE: ${ENT_POSTGRES_DATABASE:-owndsh}
      ENT_POSTGRES_USERNAME: ${ENT_POSTGRES_USERNAME:-owndsh}
      ENT_MASTER_KEY_FILE: /run/secrets/enterprise_master_key
      ENT_PLUGIN_SIGNING_PRIVATE_KEY_FILE: /run/secrets/plugin_signing_private_key
      ENT_ARTIFACT_ROOT: /var/lib/enterprise/artifacts
      XDG_CACHE_HOME: /tmp
      JAVA_TOOL_OPTIONS: ${OWNDSH_JAVA_TOOL_OPTIONS:--XX:MaxRAMPercentage=75 -XX:+ExitOnOutOfMemoryError}
      TZ: ${ENT_DEPLOYMENT_TIME_ZONE:-Asia/Shanghai}
    secrets:
      - source: postgres_password
        target: spring.datasource.dynamic.datasource.master.password
      - source: redis_password
        target: spring.data.redis.password
      - source: sa_token_jwt_secret_key
        target: sa_token_jwt_secret_key
      - enterprise_master_key
      - plugin_signing_private_key
    volumes:
      - artifacts:/var/lib/enterprise/artifacts
      - server_logs:/app/logs
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      storage-init: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 45s
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
      - /app/tmp:size=128m,mode=1777
    networks: [backend]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 40s

  console:
    image: ${OWNDSH_CONSOLE_IMAGE:?OWNDSH_CONSOLE_IMAGE must be set}
    platform: linux/amd64
    user: "101:101"
    restart: unless-stopped
    ports:
      - "${OWNDSH_HTTP_BIND:-0.0.0.0}:${OWNDSH_HTTP_PORT:-8080}:8080"
    depends_on:
      server: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    networks: [backend]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

networks:
  backend:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  artifacts:
  server_logs:

secrets:
  postgres_password:
    file: ${OWNDSH_STATE_DIR:?OWNDSH_STATE_DIR must be set}/secrets/postgres_password
  redis_password:
    file: ${OWNDSH_STATE_DIR:?OWNDSH_STATE_DIR must be set}/secrets/redis_password
  sa_token_jwt_secret_key:
    file: ${OWNDSH_STATE_DIR:?OWNDSH_STATE_DIR must be set}/secrets/sa_token_jwt_secret_key
  enterprise_master_key:
    file: ${OWNDSH_STATE_DIR:?OWNDSH_STATE_DIR must be set}/secrets/enterprise_master_key
  plugin_signing_private_key:
    file: ${OWNDSH_STATE_DIR:?OWNDSH_STATE_DIR must be set}/secrets/plugin_signing_private_key
configs:
  postgres_baseline:
    file: ${OWNDSH_STATE_DIR:?OWNDSH_STATE_DIR must be set}/releases/${OWNDSH_RELEASE_VERSION:?OWNDSH_RELEASE_VERSION must be set}/database/postgres_owndsh.sql
