# [INPUT]: 依赖带默认值的环境变量、可覆盖的 PostgreSQL 基线、四个持久卷、可写临时目录与锁定 Linux amd64 镜像。
# [OUTPUT]: 提供默认拉取 GHCR next 镜像、`admin/owndsh` 幂等初始化、HTTP Console、单 Server、PostgreSQL 17.6 和 Redis 7.4.5 拓扑。
# [POS]: T21 部署运行时事实源；OwnDsh 不终止 TLS，空数据库先由官方 initdb 装载 version 0，Flyway 接管后续版本。
# [PROTOCOL]: 变更时更新此头部，然后检查 CLAUDE.md

name: ${OWNDSH_COMPOSE_PROJECT_NAME:-owndsh}

services:
  postgres:
    image: ${OWNDSH_BASE_IMAGE_REGISTRY:-docker.io/library}/postgres:17.6-alpine3.22@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
    platform: linux/amd64
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${ENT_POSTGRES_DATABASE:-owndsh}
      POSTGRES_USER: ${ENT_POSTGRES_USERNAME:-owndsh}
      POSTGRES_PASSWORD: ${ENT_POSTGRES_PASSWORD:-owndsh}
      TZ: UTC
    configs:
      - source: postgres_baseline
        target: /docker-entrypoint-initdb.d/00-owndsh-baseline.sql
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    networks: [backend]
    security_opt: [no-new-privileges:true]

  redis:
    image: ${OWNDSH_BASE_IMAGE_REGISTRY:-docker.io/library}/redis:7.4.5-alpine3.21@sha256:bb186d083732f669da90be8b0f975a37812b15e913465bb14d845db72a4e3e08
    platform: linux/amd64
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${ENT_REDIS_PASSWORD:-owndsh}
    command:
      - sh
      - -ec
      - exec redis-server --appendonly yes --appendfsync everysec --requirepass "$$REDIS_PASSWORD"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 5s
    networks: [backend]
    security_opt: [no-new-privileges:true]

  storage-init:
    image: ${OWNDSH_SERVER_IMAGE:-ghcr.io/boe1900/owndsh-server:next}
    platform: linux/amd64
    user: "0:0"
    command: ["sh", "-ec", "chown -R 10001:10001 /var/lib/enterprise /app/logs"]
    volumes:
      - artifacts:/var/lib/enterprise/artifacts
      - server_logs:/app/logs
    restart: "no"
    networks: [backend]
    cap_drop: [ALL]
    cap_add: [CHOWN]
    security_opt: [no-new-privileges:true]

  server:
    image: ${OWNDSH_SERVER_IMAGE:-ghcr.io/boe1900/owndsh-server:next}
    platform: linux/amd64
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: deploy
      ENT_PUBLIC_BASE_URL: ${ENT_PUBLIC_BASE_URL:-http://localhost:${OWNDSH_HTTP_PORT:-8080}}
      ENT_DEPLOYMENT_TIME_ZONE: ${ENT_DEPLOYMENT_TIME_ZONE:-Asia/Shanghai}
      ENT_ALLOW_INSECURE_OIDC: ${ENT_ALLOW_INSECURE_OIDC:-false}
      ENT_POSTGRES_DATABASE: ${ENT_POSTGRES_DATABASE:-owndsh}
      ENT_POSTGRES_USERNAME: ${ENT_POSTGRES_USERNAME:-owndsh}
      ENT_POSTGRES_HOST: postgres
      ENT_POSTGRES_PORT: "5432"
      ENT_POSTGRES_PASSWORD: ${ENT_POSTGRES_PASSWORD:-owndsh}
      ENT_REDIS_HOST: redis
      ENT_REDIS_PORT: "6379"
      ENT_REDIS_PASSWORD: ${ENT_REDIS_PASSWORD:-owndsh}
      SA_TOKEN_JWT_SECRET_KEY: ${SA_TOKEN_JWT_SECRET_KEY:-owndsh-jwt-secret-change-me-000000000000000000000000}
      ENT_MASTER_KEY: ${ENT_MASTER_KEY:-0123456789abcdef0123456789abcdef}
      ENT_PLUGIN_SIGNING_PRIVATE_KEY: ${ENT_PLUGIN_SIGNING_PRIVATE_KEY:-MC4CAQAwBQYDK2VwBCIEILTqRfExQQ2Hw4v8uM2qtYMsd8gPj+OoOGYXCofntEsY}
      ENT_BOOTSTRAP_ADMIN_USERNAME: ${ENT_BOOTSTRAP_ADMIN_USERNAME:-admin}
      ENT_BOOTSTRAP_ADMIN_PASSWORD: ${ENT_BOOTSTRAP_ADMIN_PASSWORD:-owndsh}
      ENT_ARTIFACT_ROOT: /var/lib/enterprise/artifacts
      XDG_CACHE_HOME: /tmp
      JAVA_TOOL_OPTIONS: ${OWNDSH_JAVA_TOOL_OPTIONS:--XX:MaxRAMPercentage=75 -XX:+ExitOnOutOfMemoryError}
      TZ: ${ENT_DEPLOYMENT_TIME_ZONE:-Asia/Shanghai}
    volumes:
      - artifacts:/var/lib/enterprise/artifacts
      - server_logs:/app/logs
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      storage-init: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 45s
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
      - /app/tmp:size=128m,mode=1777
    networks: [backend]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 40s

  console:
    image: ${OWNDSH_CONSOLE_IMAGE:-ghcr.io/boe1900/owndsh-console:next}
    platform: linux/amd64
    user: "101:101"
    restart: unless-stopped
    ports:
      - "${OWNDSH_HTTP_BIND:-0.0.0.0}:${OWNDSH_HTTP_PORT:-8080}:8080"
    depends_on:
      server: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    networks: [backend]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

networks:
  backend:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  artifacts:
  server_logs:

configs:
  postgres_baseline:
    file: ${OWNDSH_POSTGRES_BASELINE:-../database/postgres_owndsh.sql}
