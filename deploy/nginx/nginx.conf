# [INPUT]: 依赖同网络 server:8080、构建期管理端静态资源与可选上级反向代理 forwarding headers。
# [OUTPUT]: 提供 HTTP 同源入口、OpenAPI 命名空间代理、管理端 SPA/认证回调、SSE 无缓冲、健康检查和规范代理头。
# [POS]: Console 静态资源与 API 的轻量 HTTP 网关；TLS 终止由部署方的反向代理、Ingress 或负载均衡负责。
# [PROTOCOL]: 变更时更新此头部，然后检查 CLAUDE.md

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  sendfile on;
  server_tokens off;
  client_max_body_size 52m;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  map $http_x_forwarded_proto $external_proto {
    http http;
    https https;
    default $scheme;
  }

  map "$http_x_forwarded_proto:$http_x_forwarded_port" $external_port {
    ~^https:$ 443;
    ~^http:$ 80;
    "~^(?:https|http):(?<forwarded_port>[0-9]{1,5})$" $forwarded_port;
    default $server_port;
  }

  upstream enterprise_server {
    server server:8080;
    keepalive 32;
  }

  server {
    listen 8080;
    server_name _;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Forwarded "";
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $external_port;
    proxy_set_header X-Forwarded-Proto $external_proto;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Connection "";
    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    location = /healthz {
      proxy_pass http://enterprise_server/actuator/health;
      access_log off;
    }

    location ~ ^/prod-api/enterprise/gateway/v1/(?:chat/completions|responses|messages)$ {
      rewrite ^/prod-api(/.*)$ $1 break;
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 600s;
      proxy_pass http://enterprise_server;
    }

    location /prod-api/ {
      rewrite ^/prod-api(/.*)$ $1 break;
      proxy_pass http://enterprise_server;
    }

    location ~ ^/enterprise/gateway/v1/(?:chat/completions|responses|messages)$ {
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 600s;
      proxy_pass http://enterprise_server;
    }

    location = /enterprise/auth/callback {
      root /usr/share/nginx/html;
      try_files /index.html =404;
    }

    location /enterprise/admin/v1/ {
      proxy_pass http://enterprise_server;
    }

    location /enterprise/api/v1/ {
      proxy_pass http://enterprise_server;
    }

    location /enterprise/auth/ {
      proxy_pass http://enterprise_server;
    }

    location = /auth/code {
      proxy_pass http://enterprise_server;
    }

    location /assets/ {
      root /usr/share/nginx/html;
      try_files $uri =404;
      expires 7d;
      add_header Cache-Control "public, immutable";
    }

    location / {
      root /usr/share/nginx/html;
      try_files $uri $uri/ /index.html;
    }
  }
}
