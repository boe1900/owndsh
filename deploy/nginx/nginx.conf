# [INPUT]: 依赖同网络 owndsh-server:8080、构建期管理端静态资源、浏览器原始 Host 与可选上级反向代理 forwarding headers。
# [OUTPUT]: 提供保留外部 authority 的同源入口、admin/console/api/auth 代理、原生工作区静态资源和 Remote Upgrade。
# [POS]: Console 静态资源与 API 的轻量 HTTP 网关；TLS 终止由部署方的反向代理、Ingress 或负载均衡负责。
# [PROTOCOL]: 变更时更新此头部，然后检查 CLAUDE.md

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  sendfile on;
  server_tokens off;
  client_max_body_size 52m;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  map $http_x_forwarded_proto $external_proto {
    http http;
    https https;
    default $scheme;
  }

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  upstream enterprise_server {
    server owndsh-server:8080;
    keepalive 32;
  }

  upstream enterprise_remote {
    server owndsh-server:8090;
    keepalive 16;
  }

  server {
    listen 8080;
    server_name _;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin always;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Forwarded "";
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Port $http_x_forwarded_port;
    proxy_set_header X-Forwarded-Proto $external_proto;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Connection "";
    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    location = /healthz {
      proxy_pass http://enterprise_server/actuator/health;
      access_log off;
    }

    location ~ ^/enterprise/gateway/v1/(?:chat/completions|responses|messages)$ {
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 600s;
      proxy_pass http://enterprise_server;
    }

    location = /enterprise/plugin-market/index.json {
      proxy_pass http://enterprise_server;
    }

    location = /remote/ws/v1 {
      proxy_pass http://enterprise_remote;
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 1h;
      proxy_send_timeout 1h;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Origin $http_origin;
    }

    location = /enterprise/auth/callback {
      root /usr/share/nginx/html;
      try_files /index.html =404;
    }

    location /enterprise/admin/v1/ {
      proxy_pass http://enterprise_server;
    }

    location /enterprise/console/v1/ {
      proxy_pass http://enterprise_server;
    }

    location /enterprise/api/v1/ {
      proxy_pass http://enterprise_server;
    }

    location /enterprise/auth/ {
      proxy_pass http://enterprise_server;
    }

    location = /auth/code {
      proxy_pass http://enterprise_server;
    }

    location /assets/ {
      root /usr/share/nginx/html;
      try_files $uri =404;
      expires 7d;
      add_header Cache-Control "public, immutable";
    }

    location / {
      root /usr/share/nginx/html;
      try_files $uri $uri/ /index.html;
    }
  }
}
