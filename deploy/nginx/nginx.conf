# [INPUT]: 依赖 Docker secret TLS 证书/私钥、同网络 server:8080 与构建期管理端静态资源。
# [OUTPUT]: 提供 TLS 1.2/1.3 同源入口、SSE 无缓冲、SPA fallback、健康检查和可信代理头。
# [POS]: 唯一公网安全边界，删除客户端 Forwarded/X-Forwarded-* 后只写本跳可信事实。
# [PROTOCOL]: 变更时更新此头部，然后检查 CLAUDE.md

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  sendfile on;
  server_tokens off;
  client_max_body_size 52m;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  upstream enterprise_server {
    server server:8080;
    keepalive 32;
  }

  server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate /run/secrets/tls.crt;
    ssl_certificate_key /run/secrets/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Forwarded "";
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port 443;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Connection "";
    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    location = /healthz {
      proxy_pass http://enterprise_server/actuator/health;
      access_log off;
    }

    location = /prod-api/enterprise/gateway/v1/chat/completions {
      rewrite ^/prod-api(/.*)$ $1 break;
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 600s;
      proxy_pass http://enterprise_server;
    }

    location /prod-api/ {
      rewrite ^/prod-api(/.*)$ $1 break;
      proxy_pass http://enterprise_server;
    }

    location = /enterprise/gateway/v1/chat/completions {
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 600s;
      proxy_pass http://enterprise_server;
    }

    location /enterprise/ {
      proxy_pass http://enterprise_server;
    }

    location = /auth/code {
      proxy_pass http://enterprise_server;
    }

    location /assets/ {
      root /usr/share/nginx/html;
      try_files $uri =404;
      expires 7d;
      add_header Cache-Control "public, immutable";
    }

    location / {
      root /usr/share/nginx/html;
      try_files $uri $uri/ /index.html;
    }
  }
}
